<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Monitoring System</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* --- GRID & DASHBOARD --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .junction-card {
            cursor: pointer;
            border-left: 6px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .junction-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: #60a5fa;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline {
            background: transparent;
            border: 2px dashed var(--text-sub);
            color: var(--text-sub);
            width: 100%;
            height: 100%;
            min-height: 160px;
            font-size: 16px;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3); }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        
        .btn-danger { background: var(--danger); color: white; width: 100%; margin-top: auto; }
        .btn-danger:hover { background: #dc2626; }

        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 20px; }
        label { display: block; color: var(--text-sub); margin-bottom: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        /* --- ROAD VISUALIZER --- */
        .road-container {
            background-color: #2a2a2a;
            background-image: 
                radial-gradient(white 1%, transparent 2%),
                linear-gradient(90deg, transparent 49%, rgba(255,255,255,0.1) 50%, transparent 51%);
            background-size: 10px 10px, 100% 50px;
            border-radius: 12px;
            border: 4px solid #475569;
            position: relative;
            overflow: hidden;
            margin-bottom: 0; /* No margin bottom, strip is below */
            transition: height 0.3s ease;
            width: 100%;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
        }

        .vehicle {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 4px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
            overflow: hidden;
        }

        /* --- NEW: INFO STRIP (Entry/Exit/Tracking) --- */
        .info-strip {
            background: #1e293b;
            border: 1px solid #475569;
            border-top: none;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .strip-label {
            font-weight: 800;
            color: var(--text-sub);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .live-tracking {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .track-tag {
            background: #0f172a;
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- CONTROLS --- */
        .control-layout { display: grid; grid-template-columns: 3fr 1.2fr; gap: 24px; }
        
        .cat-container { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .cat-btn { background: #334155; color: var(--text-sub); padding: 8px 16px; border-radius: 6px; border:none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .cat-btn.active { background: var(--accent); color: white; box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        
        .sub-container { 
            background: rgba(15, 23, 42, 0.5); 
            padding: 16px; 
            border-radius: 8px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            border: 1px dashed #475569;
            margin-bottom: 16px;
            animation: slideDown 0.3s ease-out;
        }
        
        .sub-btn { 
            background: #1e293b; 
            border: 1px solid #475569; 
            color: white; 
            padding: 8px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px;
            font-size: 13px;
        }
        .sub-btn:hover { border-color: var(--accent); background: #334155; }

        /* --- STATUS MONITOR --- */
        .status-panel {
            width: 100%; height: 100%;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background 0.5s;
            position: relative;
            overflow: hidden;
        }
        .status-panel::before {
            content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.2), transparent);
        }
        .status-big-text { font-size: 24px; font-weight: 900; text-align: center; z-index: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .status-icon { font-size: 48px; margin-bottom: 10px; z-index: 2; animation: pulse 2s infinite; }

        /* --- PROGRESS BAR --- */
        .progress-bg { background: #334155; height: 12px; border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* --- POPUP --- */
        #popup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(239, 68, 68, 0.95); color: white;
            padding: 16px 32px; border-radius: 50px;
            font-weight: bold; font-size: 16px;
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000; display: none;
            animation: slideInTop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* UTILS & ANIMATIONS */
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInTop { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Vehicle Colors */
        .v-green { background: #22c55e; } .v-teal { background: #14b8a6; }
        .v-yellow { background: #eab308; color: black; } .v-blue { background: #3b82f6; }
        .v-purple { background: #a855f7; } .v-orange { background: #f97316; }
        .v-gray { background: #64748b; } .v-red { background: #ef4444; } .v-indigo { background: #6366f1; }
    </style>
</head>
<body>

    <div id="popup">⛔ BLOCKED! Road is physically full.</div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="container">
        <!-- UPDATED TITLE -->
        <h1><span style="color: var(--accent);">📍</span> TRAFFIC MONITORING SYSTEM</h1>
        <div class="grid" id="junctionGrid">
            <div class="card" style="display:flex; align-items:center; justify-content:center; padding:0;">
                <button class="btn-outline" onclick="showCreate()">
                    <span style="font-size: 40px;">+</span><br>Add New Junction
                </button>
            </div>
        </div>
    </div>

    <!-- CREATE VIEW -->
    <div id="createView" class="container hidden" style="max-width: 500px; margin-top: 8vh;">
        <div class="card">
            <h2 style="margin-top:0;">Setup New Junction</h2>
            <div class="input-group">
                <label>Junction Name</label>
                <input type="text" id="newName" placeholder="e.g. MG Road / City Center">
            </div>
            <div class="input-group">
                <label>Road Length (meters)</label>
                <input type="number" id="newLen" value="50">
            </div>
            <div class="input-group">
                <label>Total Road Width (meters)</label>
                <input type="number" id="newWidth" value="7" placeholder="7.0 (Standard 2-Lane)">
            </div>
            <div style="display:flex; gap:12px; margin-top: 30px;">
                <button class="btn btn-secondary" style="flex:1;" onclick="showDashboard()">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="createJunction()">Create Junction</button>
            </div>
        </div>
    </div>

    <!-- CONTROLLER VIEW -->
    <div id="controllerView" class="container hidden">
        <!-- HEADER -->
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 16px 24px;">
            <div style="display:flex; align-items:center; gap:20px;">
                <button class="btn btn-secondary" onclick="showDashboard()">← Back</button>
                <div>
                    <h2 id="activeName" style="margin:0; font-size: 20px;">MG Road</h2>
                    <span id="activeDetails" style="color:var(--text-sub); font-size:13px;">Width: 7m | Length: 100m | Gap: 0.5m</span>
                </div>
            </div>
            <div style="text-align:right; min-width: 250px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span style="font-size: 12px; color: var(--text-sub); font-weight: bold;">DENSITY</span>
                    <span id="densityText" style="font-weight:bold; font-size:14px;">0%</span>
                </div>
                <div class="progress-bg">
                    <div id="densityBar" class="progress-fill" style="width: 0%; background: var(--success);"></div>
                </div>
            </div>
        </div>
        
        <!-- ROAD VISUAL -->
        <div id="road" class="road-container"></div>
        
        <!-- INFO STRIP (Entry/Exit/Tracking) -->
        <div class="info-strip">
            <div class="strip-label">EXIT &lt;&lt;</div>
            
            <div id="liveTrackingBar" class="live-tracking">
                <span style="opacity:0.5; font-size:13px; color:#94a3b8;">Road Empty</span>
            </div>

            <div class="strip-label">&gt;&gt; ENTRY</div>
        </div>

        <!-- CONTROLS -->
        <div class="control-layout">
            <!-- Left: Vehicle Selection -->
            <div class="card" style="display:flex; flex-direction:column;">
                <label>Select Category</label>
                <div class="cat-container" id="catContainer"></div>
                
                <div id="subContainer" class="sub-container hidden"></div>
                
                <!-- Clear Button -->
                <button class="btn btn-danger" onclick="removeVehicle()">
                    <span>CLEAR VEHICLE</span>
                    <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px;">First Out</span>
                </button>
            </div>

            <!-- Right: Live Monitor -->
            <div class="card" style="padding:0; border:none; height:100%;">
                <div id="statusPanel" class="status-panel">
                    <div id="statusIcon" class="status-icon">✅</div>
                    <div id="statusText" class="status-big-text">TRAFFIC CLEAR</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAP = 0.5; 
        const LAT_GAP = 0.4; 
        const STRIP_WIDTH = 0.25; 
        
        const VEHICLES = {
            'Cycle': [{name:'Cycle', l:1.6, w:0.6, c:'v-green', i:'🚲'}],
            'Bike': [{name:'Scooter', l:1.8, w:0.7, c:'v-teal', i:'🛵'}, {name:'Bike', l:2.0, w:0.8, c:'v-teal', i:'🏍️'}],
            'Auto': [{name:'Auto', l:2.6, w:1.3, c:'v-yellow', i:'🛺'}, {name:'Goods Auto', l:3.0, w:1.4, c:'v-yellow', i:'🛺'}],
            'Car': [{name:'Hatchback', l:3.7, w:1.7, c:'v-blue', i:'🚗'}, {name:'Sedan', l:4.5, w:1.8, c:'v-blue', i:'🚙'}, {name:'SUV', l:4.8, w:2.0, c:'v-blue', i:'🚙'}],
            'Bus': [{name:'Mini Bus', l:6.0, w:2.2, c:'v-purple', i:'🚐'}, {name:'City Bus', l:12.0, w:2.55, c:'v-purple', i:'🚌'}],
            'Truck': [{name:'Mini Truck', l:3.8, w:1.5, c:'v-orange', i:'🛻'}, {name:'Truck', l:6.0, w:2.1, c:'v-orange', i:'🚚'}],
            'Lorry': [{name:'Lorry', l:10.0, w:2.5, c:'v-gray', i:'🚛'}, {name:'Tanker', l:11.0, w:2.5, c:'v-red', i:'🚒'}, {name:'Container', l:16.0, w:2.6, c:'v-indigo', i:'🚚'}]
        };

        let junctions = [], activeId = null;
        
        function calcDensity(j) {
            if (!j || !j.strips) return 0;
            const totalCap = j.strips.length * j.len;
            const used = j.strips.reduce((a,b)=>a+b,0);
            return Math.min(100, (used/totalCap)*100).toFixed(1);
        }

        function showDashboard() { 
            document.getElementById('dashboardView').classList.remove('hidden'); 
            document.getElementById('createView').classList.add('hidden'); 
            document.getElementById('controllerView').classList.add('hidden'); 
            renderGrid(); 
        }
        function showCreate() { document.getElementById('dashboardView').classList.add('hidden'); document.getElementById('createView').classList.remove('hidden'); }
        
        function createJunction() {
            const name = document.getElementById('newName').value || "Junction";
            const len = parseFloat(document.getElementById('newLen').value);
            const width = parseFloat(document.getElementById('newWidth').value);
            
            const numStrips = Math.floor(width/STRIP_WIDTH);
            
            junctions.push({ 
                id: Date.now(), name, len, width, 
                vehicles: [], 
                strips: new Array(numStrips).fill(0) 
            });
            showDashboard();
        }

        function renderGrid() {
            const grid = document.getElementById('junctionGrid'); 
            while(grid.children.length > 1) grid.removeChild(grid.lastChild);
            
            junctions.forEach(j => {
                const d = calcDensity(j);
                const color = d > 90 ? '#ef4444' : d > 70 ? '#f59e0b' : '#22c55e';
                const card = document.createElement('div');
                card.className = 'junction-card card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; color: white;">${j.name}</h3>
                        <span style="color:${color}; font-weight:bold; background:rgba(0,0,0,0.2); padding:2px 8px; border-radius:4px;">${d}% Load</span>
                    </div>
                    <p style="color:#94a3b8; margin:8px 0 0 0; font-size:14px;">${j.width}m Wide | ${j.len}m Long</p>
                    <p style="color:#64748b; margin:4px 0 0 0; font-size:12px;">${j.vehicles.length} Vehicles Active</p>
                `;
                card.onclick = () => openJunction(j.id); 
                grid.appendChild(card);
            });
        }

        function openJunction(id) {
            activeId = id; 
            const j = junctions.find(x => x.id === id);
            document.getElementById('dashboardView').classList.add('hidden'); 
            document.getElementById('controllerView').classList.remove('hidden');
            document.getElementById('activeName').innerText = j.name; 
            document.getElementById('activeDetails').innerText = `${j.width}m Wide | ${j.len}m Long | Gaps: ${GAP}m (Long) / ${LAT_GAP}m (Lat)`;
            renderRoad(j); renderCategories(); updateStats(); updateTracking(j);
        }

        function updateTracking(j) {
            const container = document.getElementById('liveTrackingBar');
            if(j.vehicles.length === 0) {
                container.innerHTML = '<span style="opacity:0.5; font-size:13px; color:#94a3b8;">Road Empty</span>';
                return;
            }
            
            const counts = {};
            j.vehicles.forEach(v => { counts[v.name] = (counts[v.name] || 0) + 1; });
            
            container.innerHTML = '';
            for (const [name, count] of Object.entries(counts)) {
                container.innerHTML += `<span class="track-tag">${count} ${name}</span>`;
            }
        }

        function renderRoad(j) {
            const road = document.getElementById('road'); 
            road.style.height = (j.width * 30) + 'px'; 
            
            const oldCars = road.querySelectorAll('.vehicle');
            oldCars.forEach(v => v.remove());
            
            const roadWidthPx = road.offsetWidth; 
            const scale = roadWidthPx / j.len;
            const totalRoadWidthMeters = j.strips.length * STRIP_WIDTH;

            j.vehicles.forEach(v => {
                const el = document.createElement('div'); 
                el.className = `vehicle ${v.c}`; 
                el.innerHTML = v.i;
                
                const topPercent = ((v.xStrip * STRIP_WIDTH) / totalRoadWidthMeters) * 100; 
                const heightPercent = (v.w / totalRoadWidthMeters) * 100;
                
                el.style.top = topPercent + '%'; 
                el.style.left = (v.pos * scale) + 'px'; 
                el.style.width = (v.l * scale) + 'px'; 
                el.style.height = heightPercent + '%';
                
                if((v.l * scale) < 20) el.innerHTML = '';
                
                road.appendChild(el);
            });
        }

        function renderCategories() {
            const c = document.getElementById('catContainer'); c.innerHTML = '';
            Object.keys(VEHICLES).forEach(cat => { 
                const btn = document.createElement('button'); 
                btn.className = 'cat-btn'; 
                btn.innerText = cat; 
                btn.onclick = () => showSub(cat, btn); 
                c.appendChild(btn); 
            });
        }

        function showSub(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); 
            btn.classList.add('active');
            const s = document.getElementById('subContainer'); 
            s.innerHTML = ''; 
            s.classList.remove('hidden');
            
            VEHICLES[cat].forEach(v => { 
                const b = document.createElement('button'); 
                b.className = 'sub-btn'; 
                b.innerHTML = `${v.i} ${v.name}`; 
                b.onclick = () => addVehicle(v); 
                s.appendChild(b); 
            });
        }

        function addVehicle(v) {
            const j = junctions.find(x => x.id === activeId);
            const reqStrips = Math.ceil((v.w + LAT_GAP) / STRIP_WIDTH); 
            let bestStart = -1, minMax = Infinity;

            for(let i=0; i <= j.strips.length - reqStrips; i++) {
                let currMax = 0; 
                for(let k=0; k<reqStrips; k++) currMax = Math.max(currMax, j.strips[i+k]);
                if(currMax < minMax) { minMax = currMax; bestStart = i; }
            }

            if(bestStart !== -1 && (minMax + v.l + GAP) <= j.len) {
                for(let k=0; k<reqStrips; k++) j.strips[bestStart+k] = minMax + v.l + GAP;
                
                j.vehicles.push({ 
                    ...v, id: Date.now(), 
                    xStrip: bestStart, pos: minMax 
                });
                
                renderRoad(j); updateStats(); updateTracking(j);
            } else {
                const p = document.getElementById('popup'); 
                p.innerText = `⛔ Junction cannot fit another ${v.name}. Clear vehicles!`; 
                p.style.display = 'block'; 
                setTimeout(() => p.style.display = 'none', 2500);
            }
        }

        function removeVehicle() {
            const j = junctions.find(x => x.id === activeId);
            if(j.vehicles.length === 0) return;
            
            const v = j.vehicles.shift(); 
            
            const numStrips = Math.floor(j.width / STRIP_WIDTH); 
            const newStrips = new Array(numStrips).fill(0);
            
            j.vehicles.forEach(veh => {
                const req = Math.ceil((veh.w + LAT_GAP) / STRIP_WIDTH); 
                let cMax = 0;
                for(let k=0; k<req; k++) cMax = Math.max(cMax, newStrips[veh.xStrip+k]);
                veh.pos = cMax;
                for(let k=0; k<req; k++) newStrips[veh.xStrip+k] = veh.pos + veh.l + GAP;
            });
            j.strips = newStrips; 
            
            renderRoad(j); updateStats(); updateTracking(j);
        }

        function updateStats() {
            const j = junctions.find(x => x.id === activeId);
            const d = calcDensity(j);
            
            let msg="TRAFFIC CLEAR", bg="#22c55e", icon="✅";
            if(d > 90) { msg="GRIDLOCK ALERT"; bg="#991b1b"; icon="🛑"; }
            else if(d > 70) { msg="HEAVY RUSH"; bg="#ef4444"; icon="⚠️"; }
            else if(d > 50) { msg="MODERATE RUSH"; bg="#f97316"; icon="⚠️"; }
            
            document.getElementById('densityText').innerText = `${d}%`;
            document.getElementById('densityBar').style.width = d + '%'; 
            document.getElementById('densityBar').style.background = bg;
            
            const panel = document.getElementById('statusPanel');
            panel.style.background = bg;
            document.getElementById('statusText').innerText = msg;
            document.getElementById('statusIcon').innerText = icon;
        }
    </script>
</body>
</html>
